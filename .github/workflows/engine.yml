# Engine checks on macOS and Linux (PLAN.md §7): lint, unit tests, and every parity and golden test.
# The study data, models and golden set are in git, so nothing else is checked out. Runs on every PR
# (no path filter) because branch protection on main requires it.
name: engine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_data.py
        working-directory: .
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -rs
